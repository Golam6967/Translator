services:
  db:
    image: postgres:16-alpine
    container_name: acculator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acculator
      POSTGRES_PASSWORD: acculator
      POSTGRES_DB: acculator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acculator -d acculator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
